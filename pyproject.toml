[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabiq"
version = "0.1.0"
description = "Production multi-agent RAG system for technical documentation intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.35.0",
    "anthropic>=0.29.0",
    "azure-search-documents>=11.6.0",
    "azure-identity>=1.17.0",
    "langgraph>=0.1.19",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langsmith>=0.1.77",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]
dashboard = [
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "pandas>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fabiq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/fabiq --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.coverage.run]
source = ["src/fabiq"]
omit = ["*/tests/*", "*/__init__.py"]
