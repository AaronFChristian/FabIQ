name: FabIQ CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  # Dummy secrets for CI — no real Azure calls in tests
  AZURE_OPENAI_API_KEY: ci-placeholder
  AZURE_OPENAI_ENDPOINT: https://ci.openai.azure.com/
  AZURE_SEARCH_ENDPOINT: https://ci.search.windows.net
  AZURE_SEARCH_API_KEY: ci-placeholder
  ANTHROPIC_API_KEY: ci-placeholder

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev deps
        run: pip install ruff mypy pydantic pydantic-settings
      - name: Ruff lint
        run: ruff check src/
      - name: Ruff format check
        run: ruff format --check src/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=src/fabiq --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fabiq:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run --rm \
            -e AZURE_OPENAI_API_KEY=ci \
            -e AZURE_OPENAI_ENDPOINT=https://ci.openai.azure.com/ \
            -e AZURE_SEARCH_ENDPOINT=https://ci.search.windows.net \
            -e AZURE_SEARCH_API_KEY=ci \
            -e ANTHROPIC_API_KEY=ci \
            fabiq:${{ github.sha }} \
            python -c "from fabiq.config import get_settings; print(get_settings().app_env)"
